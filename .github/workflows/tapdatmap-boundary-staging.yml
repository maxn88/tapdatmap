name: Stage Census boundary files
on:
  push:
    branches: [work/tapdatmap-boundaries]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import geometry and stage the generated files
        run: |
          set -euo pipefail
          python3 scripts/import-boundaries.py
          test "$(find public/boundaries -name '*.json' | wc -l)" -eq 154
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boundary-ids.json public/boundaries/
          git rm .github/workflows/tapdatmap-boundary-staging.yml
          git commit -m "Materialize 154 Census boundaries for TapDatMap"
          git push origin HEAD:refs/heads/work/tapdatmap-boundaries
